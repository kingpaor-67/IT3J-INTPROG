<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHP JSON AJAX</title>
</head>
<body>
    <h2>Welcome Form</h2>
    <form id="welcomeForm">
        <label for="name">Name:</label>
        <input type="text" id="name" required>
        <button type="submit">Submit</button>
    </form>
    <p id="result"></p>

    <script>
        document.getElementById("welcomeForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const name = document.getElementById("name").value;

            try {
                const response = await fetch("lab5.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: name })
                });
                const data = await response.json();
                document.getElementById("result").textContent = JSON.stringify(data);
            } catch (error) {
                document.getElementById("result").textContent = "Request failed. Make sure Apache is running.";
            }
        });
    </script>
</body>
</html>
